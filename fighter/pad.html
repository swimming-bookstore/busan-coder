<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__FIGHTER_NAME__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --void: #083054;
    --navy: #0c4870;
    --well: #061c30;
    --ink: #20140c;
    --cream: #fcecc8;
    --coin: #f8d030;
    --cyan: #50d8f8;
    --pink: #f878a8;
    --dim: #847464;
    --panel: #f8d088;
    --gutter: #0a2c44;
    --grass: #48c858;
    --brick: #d85418;
    --glass: rgba(8, 48, 84, 0.78);
  }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(12px) saturate(1.05);
    -webkit-backdrop-filter: blur(12px) saturate(1.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--void); color: var(--cream);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  body { display: flex; flex-direction: column; align-items: stretch; min-height: 100%; }
  #app {
    width: 100%; height: 100%;
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--void);
  }
  #stage-wrap {
    position: relative;
    flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center;
    padding: 0; background: var(--void);
  }
  #stage {
    width: 100%; height: 100%;
    background: var(--void); image-rendering: pixelated; display: block;
  }
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 16px;
    color: var(--cream);
    font-size: 13px;
    letter-spacing: .04em;
  }
  #topbar .line { color: var(--cream); }
  #topbar .spacer { flex: 1; }
  #topbar button {
    background: transparent; color: var(--cream); border: none;
    font: inherit; padding: 4px 8px; cursor: pointer; opacity: .85;
  }
  #topbar button:hover { color: var(--cyan); opacity: 1; }
  #topbar button:active { transform: translateY(1px); }
  #hud {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
    width: 100%;
    padding: 0;
  }
  #dock {
    background: transparent;
    color: var(--cream);
    border: none;
    box-shadow: none;
  }
  #composer-row {
    display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: stretch;
    padding: 8px 16px;
  }
  #composer-row .gt {
    color: var(--coin); font-weight: 700; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #composer {
    width: 100%; min-height: 36px; max-height: 96px; resize: none;
    background: transparent; color: var(--cream);
    border: none;
    box-shadow: none;
    font: inherit; padding: 10px 0; outline: none;
  }
  #composer::placeholder { color: #5a6288; }
  #composer:focus { border: none; box-shadow: none; }
</style>
</head>
<body>
<div id="app">
<div id="stage-wrap">
  <header id="topbar" class="glass">
    <span class="line" id="bar">__FIGHTER_NAME__</span>
    <span class="spacer"></span>
    <button id="new-btn" type="button" title="new chat (Ctrl+N)">new chat</button>
  </header>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="hud" class="glass">
    <div id="dock">
      <div id="composer-row">
        <div class="gt">&gt;</div>
        <textarea id="composer" rows="1" placeholder=""></textarea>
      </div>
    </div>
  </div>
</div>
</div>
<script>
const W = 1280, H = 720;
const VOID = [8,48,84], NAVY = [12,72,112], INK = [32,20,12], WELL = [6,28,48];
const GUTTER = [10,44,68], CREAM = [252,236,200], COIN = [248,208,48], CYAN = [80,216,248];
const PINK = [248,120,168], GRASS = [72,200,88], BRICK = [216,84,24], PANEL = [248,208,136];
const DIM = [132,116,100], WHITE = [255,255,255];
const SKY = { RUST:[248,152,56], GO:[80,216,248], CPP:[120,168,248], PY:[248,208,56] };

const LANDS = [
  { file:"main.rs", lang:"RUST", sky:SKY.RUST,
    empty:["fn main() {","}",""],
    hello:["fn main() {",'    println!("hello, world");',"}"],
    think:"empty main read write hello world",
    talk:"Empty main is on the pad. I will write hello, world in Rust." },
  { file:"main.go", lang:"GO", sky:SKY.GO,
    empty:["package main","","func main() {","}",""],
    hello:["package main","","import \"fmt\"","","func main() {",'    fmt.Println("hello, world")',"}"],
    think:"package import fmt print hello",
    talk:"Go needs the fmt import. Then Println into main." },
  { file:"main.cpp", lang:"C++", sky:SKY.CPP,
    empty:["int main() {","    return 0;","}",""],
    hello:["#include <iostream>","","int main() {",'    std::cout << "hello, world\\n";',"    return 0;","}"],
    think:"include iostream cout hello world",
    talk:"Include iostream, then cout the line, keep return 0." },
  { file:"main.py", lang:"PYTHON", sky:SKY.PY,
    empty:["def main():","    pass",""],
    hello:["def main():",'    print("hello, world")',"","if __name__ == '__main__':","    main()"],
    think:"def pass print name main",
    talk:"Drop pass, print hello, then call main." },
];

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

function clamp(t,a=0,b=1){ return t<a?a:t>b?b:t; }
function lerp(a,b,t){ return a+(b-a)*t; }
function mix(c0,c1,t){ t=clamp(t); return [lerp(c0[0],c1[0],t),lerp(c0[1],c1[1],t),lerp(c0[2],c1[2],t)].map(Math.round); }
function rgb(c,a=1){ return a>=1?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function rect(x,y,w,h,c,a=1){ ctx.fillStyle=rgb(c,a); ctx.fillRect(x,y,w,h); }
function diamond(cx,cy,r,c,a=1){
  ctx.fillStyle=rgb(c,a); ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.7,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r*0.7,cy);
  ctx.closePath(); ctx.fill();
}
function glow(cx,cy,r,c,a){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,rgb(c,a)); g.addColorStop(1,rgb(c,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
}
function drawSea(t, sky, skyA){
  const SKY_HIGH=[72,148,204], SKY_DUSK=[255,168,112];
  const SEA_LITE=[48,164,188], SEA_DEEP=[8,48,84], FOAM=[200,236,236];
  const horizon=(H*0.38)|0;
  for (let i=0;i<18;i++){
    const k=i/17;
    let col=mix(SKY_HIGH, SKY_DUSK, k*0.72);
    if (sky && skyA>0.01) col=mix(col, sky, 0.10*skyA);
    rect(0, (horizon*i/17)|0, W, ((horizon/17)|0)+1, col);
  }
  rect(0, horizon-6, W, 10, mix(SKY_DUSK, SEA_LITE, 0.45), 0.85);
  const waterH=H-horizon;
  for (let i=0;i<24;i++){
    rect(0, horizon+((waterH*i/23)|0), W, ((waterH/23)|0)+1, mix(SEA_LITE, SEA_DEEP, i/23));
  }
  for (let i=0;i<8;i++){
    const y=horizon+18+i*48, phase=t*(0.7+i*0.05)+i*1.4;
    for (let x=0;x<W;x+=28){
      const bob=Math.sin(phase+x*0.018)*5;
      rect(x, y+bob, 20, 3, FOAM, 0.14+0.10*((i+x)%2));
    }
  }
  for (let i=0;i<25;i++){
    const sx=(i*211+((t*18)|0))%W;
    const sy=horizon+20+(i*47)%Math.max(8, H-horizon-40);
    rect(sx, sy, 3, 2, FOAM, 0.22+0.18*(0.5+0.5*Math.sin(t*2.4+i)));
  }
}
function textW(s,scale=2){ return s.length*8*scale; }
function drawText(s,x,y,c,scale=2,a=1){
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=rgb(c);
  ctx.font=`${7*scale}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline="top"; ctx.fillText(s,x,y); ctx.restore();
}
function drawShip(cx,cy,facing,scale,pulse,hull){
  const sx=11*scale*(1+0.14*pulse), sy=14*scale*(1-0.14*pulse);
  function put(px,py,w,h,c,a=1){ px*=facing; rect(cx+px-w/2,cy+py-h/2,Math.max(1,w),Math.max(1,h),c,a); }
  glow(cx,cy,sx*1.8,hull,0.22);
  put(0.72*sx,0.12*sy,0.55*sx,0.18*sy,hull);
  put(-0.72*sx,0.12*sy,0.55*sx,0.18*sy,hull);
  put(0.55*sx,0.08*sy,0.22*sx,0.1*sy,CYAN);
  put(-0.55*sx,0.08*sy,0.22*sx,0.1*sy,CYAN);
  put(0.38*sx,-0.42*sy,0.1*sx,0.28*sy,CREAM);
  put(-0.38*sx,-0.42*sy,0.1*sx,0.28*sy,CREAM);
  put(0,0.05*sy,0.38*sx,0.95*sy,hull);
  put(0,-0.05*sy,0.22*sx,0.7*sy,CREAM);
  diamond(cx,cy-0.55*sy,0.22*sy,CYAN);
  diamond(cx,cy-0.08*sy,0.16*sy,WHITE,0.9);
  put(0.18*sx,0.42*sy,0.12*sx,0.28*sy,PINK);
  put(-0.18*sx,0.42*sy,0.12*sx,0.28*sy,PINK);
}

const demo = {
  t:0, x:640, y:-64, facing:-1, scale:3.2, pulse:0, phase:0,
  sky:SKY.RUST, skyA:0, file:"", lang:"",
  code:[], landI:0, caption:"",
  box:[72,138,1136,420], caret:-1, blink:0, trail:[],
  thinking:"", thinkShow:false, thinkA:0, thinkHold:0,
  talks:[], talkI:0, talkWho:"BUSAN", live:false, tool:"",
  thoughts:[], thinkFired:0, thinkQ:[], thinkBusy:false, thinkBoard:[], thinkLift:0,
  codeQ:[], codeShots:[], codeBusy:false, codeKey:"",
  editAt:null, editOldCount:0, editSpliced:false, editInsert:null, editDelay:0,
  linger:0, launch:0,
};

function enterLand(i){
  const land=LANDS[i%LANDS.length];
  demo.landI=i%LANDS.length; demo.file=land.file; demo.lang=land.lang;
  demo.code=land.empty.slice(); demo.sky=land.sky; demo.skyA=1;
  demo.caption="";
  demo.caret=Math.min(1,Math.max(0,demo.code.length-2));
  demo.thinking=""; demo.thinkShow=false; demo.thinkA=0; demo.thinkHold=0; demo.talks=[]; demo.talkI=0;
  demo.thoughts=[]; demo.thinkFired=0; demo.thinkQ=[]; demo.thinkBusy=false; demo.thinkBoard=[]; demo.thinkLift=0;
  demo.codeQ=[]; demo.codeShots=[]; demo.codeBusy=false; demo.codeKey="";
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
}
function tint(line,i){
  if (demo.tool==="BASH" || demo.lang==="SH"){
    if (/^\$ /.test(line)) return COIN;
    if (/^exit |^error |^timeout/.test(line)) return BRICK;
    return CREAM;
  }
  if (demo.tool==="READ" && i===0) return CYAN;
  if (/(hello|print|Println|cout)/.test(line)) return GRASS;
  if (/(fn |func |def |package|import|include|int main|#include)/.test(line)) return PINK;
  if (i===0) return CYAN;
  return CREAM;
}
function toolColor(){
  return ({READ:CYAN, WRITE:GRASS, EDIT:COIN, BASH:PINK}[demo.tool]||demo.sky||CYAN);
}
const PAD = { x:72, y:138, w:1136, h:420, thinkH:72, talkH:88, gap:8 };
function layoutPad(){
  demo.box=[PAD.x, PAD.y, PAD.w, PAD.h];
}
function thinkWell(){
  return [PAD.x+10, PAD.y-PAD.thinkH-PAD.gap, PAD.w-20, PAD.thinkH];
}
function talkWell(){
  return [PAD.x, PAD.y+PAD.h+PAD.gap, PAD.w, PAD.talkH];
}
function wrapWords(text, width){
  const out=[]; let rest=(text||"").replace(/\s+/g," ").trim();
  while (rest.length>width){
    let cut=rest.lastIndexOf(" ",width); if (cut<8) cut=width;
    out.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
  }
  if (rest) out.push(rest);
  return out;
}
function wrapHard(text, width){
  width=Math.max(8, width||48);
  const out=[]; let rest=String(text??"");
  while (rest.length>width){
    const chunk=rest.slice(0,width);
    let cut=Math.max(chunk.lastIndexOf(" "), chunk.lastIndexOf("/"), chunk.lastIndexOf(";"), chunk.lastIndexOf(","));
    if (cut<width*0.45) cut=width;
    out.push(rest.slice(0,cut).trimEnd());
    rest=rest.slice(cut).trimStart();
  }
  if (rest || !out.length) out.push(rest);
  return out;
}
function clipText(s, width){
  s=String(s??"");
  if (s.length<=width) return s;
  if (width<=1) return s.slice(0, Math.max(0,width));
  return s.slice(0, width-1)+"~";
}
function padCols(){
  const [,,bw]=demo.box;
  return Math.max(12, Math.floor(((bw||1136)-80-16)/16));
}

function ungutter(text){
  return (text||"").split("\n").map(l=>{
    const m=l.match(/^\s*\d+\t(.*)$/);
    return m?m[1]:l;
  }).join("\n");
}
function setPadFile(path, tool){
  const p=path||demo.file||"file";
  demo.file = p.split(/[\\/]/).pop() || p;
  const ext = (p||"").split(".").pop();
  demo.lang = ({rs:"RUST",go:"GO",cpp:"C++",py:"PYTHON",md:"MD",json:"JSON",html:"HTML",sh:"SH"}[ext]||"FILE");
  demo.sky = ({RUST:SKY.RUST, GO:SKY.GO, "C++":SKY.CPP, PYTHON:SKY.PY, SH:SKY.GO}[demo.lang]||demo.sky||SKY.PY);
  if (tool) demo.tool = tool;
  demo.skyA = 1;
  demo.live = true;
}
function padLines(text){
  return String(text??"").replace(/\r\n/g,"\n").split("\n");
}
function padRows(){
  const [,by,,bh]=demo.box;
  return Math.max(1, Math.floor((bh-56-28)/36));
}
function viewStart(){
  const n=Math.max(1, demo.code.length||1);
  const rows=padRows();
  const focus=Math.max(0, demo.caret<0?n-1:demo.caret);
  return Math.max(0, focus-rows+1);
}
function loadOriginal(path, text){
  setPadFile(path, demo.tool||"READ");
  demo.code = padLines(text);
  demo.caret = Math.max(0, demo.code.length-1);
  demo.codeQ = [];
  demo.codeShots = [];
  demo.codeBusy = false;
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
}
function shootRead(path, text){
  setPadFile(path, "READ");
  const lines=padLines(text);
  const key="r\0"+demo.file+"\0"+lines.join("\n");
  if (key===demo.codeKey) return;
  demo.codeKey=key;
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
  demo.code=[];
  demo.caret=0;
  demo.codeQ=lines.slice();
  demo.codeShots=[];
  demo.codeBusy=false;
}
function findOld(codeLines, oldText){
  const oldLines=String(oldText||"").split("\n");
  if (!oldLines.length) return 0;
  for (let i=0;i<=codeLines.length-oldLines.length;i++){
    let ok=true;
    for (let j=0;j<oldLines.length;j++){
      if (codeLines[i+j]!==oldLines[j]){ ok=false; break; }
    }
    if (ok) return i;
  }
  const joined=codeLines.join("\n");
  const idx=joined.indexOf(oldText);
  if (idx>=0) return joined.slice(0, idx).split("\n").length-1;
  return Math.max(0, demo.caret);
}
function shootWrite(path, text){
  setPadFile(path, "WRITE");
  const lines=padLines(text);
  const key="w\0"+demo.file+"\0"+lines.join("\n");
  if (key===demo.codeKey) return;
  demo.codeKey=key;
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
  demo.code=[];
  demo.caret=0;
  demo.codeQ=lines.slice();
  demo.codeShots=[];
  demo.codeBusy=false;
}
function shootShell(cmd, text){
  const c=String(cmd||"").replace(/\s+/g," ").trim();
  demo.file = c ? ("$ "+c) : "shell";
  demo.lang = "SH";
  demo.tool = "BASH";
  demo.sky = SKY.GO;
  demo.skyA = 1;
  demo.live = true;
  const cols=padCols();
  const lines=[];
  if (c){
    wrapHard(c, cols-2).forEach((row,i)=>lines.push((i===0?"$ ":"  ")+row));
  }
  for (const row of padLines(text)){
    for (const w of wrapHard(row, cols)) lines.push(w);
  }
  const key="sh\0"+c+"\0"+lines.join("\n");
  if (key===demo.codeKey) return;
  demo.codeKey=key;
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
  demo.code=[];
  demo.caret=0;
  demo.codeQ=lines.slice();
  demo.codeShots=[];
  demo.codeBusy=false;
}
function shootEdit(path, oldText, newText){
  setPadFile(path, "EDIT");
  if (!demo.code.length) loadOriginal(path, "");
  const start=findOld(demo.code, oldText);
  const newLines=padLines(newText);
  const key="e\0"+demo.file+"\0"+start+"\0"+newLines.join("\n");
  if (key===demo.codeKey) return;
  demo.codeKey=key;
  demo.editAt=start;
  demo.editOldCount=Math.max(1, padLines(oldText).length);
  demo.editSpliced=false;
  demo.editInsert=start;
  demo.caret=start;
  demo.codeQ=newLines.slice();
  demo.codeShots=[];
  demo.codeBusy=false;
  demo.editDelay=0.35;
}
function codeTarget(){
  const [bx,by]=demo.box;
  const i=demo.editAt!=null ? (demo.editInsert??demo.editAt) : demo.code.length;
  const vis=i-viewStart();
  return [bx+80, by+56+vis*36];
}
function applyCodeLine(text){
  if (demo.editAt!=null){
    if (!demo.editSpliced){
      demo.code.splice(demo.editAt, demo.editOldCount);
      demo.editSpliced=true;
      demo.editInsert=demo.editAt;
    }
    demo.code.splice(demo.editInsert, 0, text);
    demo.editInsert++;
    demo.caret=demo.editInsert-1;
  } else {
    demo.code.push(text);
    demo.caret=Math.max(0, demo.code.length-1);
  }
  demo.pulse=1;
}
function codeFast(){
  return demo.tool==="READ" || demo.tool==="WRITE" || demo.tool==="BASH";
}
function codeSpeed(){
  return codeFast() ? 560 : 380;
}
function fireNextCode(){
  if (demo.editDelay>0 || !demo.codeQ.length) return;
  if ((demo.codeGap||0)>0) return;
  const flying=demo.codeShots.filter(sh=>sh.form<1).length;
  const maxFly=codeFast()?2:1;
  if (flying>=maxFly) return;
  const line=demo.codeQ.shift();
  const [hx,hy]=codeTarget();
  let x0=demo.x+demo.facing*18;
  let y0=demo.y-26;
  if (!Number.isFinite(x0) || !Number.isFinite(y0) || y0<-40 || y0>H+40 || x0<-40 || x0>W+40){
    x0=hx-140; y0=hy+90;
  }
  const dx=hx-x0, dy=hy-y0;
  const dist=Math.hypot(dx,dy)||1;
  const speed=codeSpeed();
  demo.codeShots.push({
    x:x0, y:y0,
    vx:(dx/dist)*speed, vy:(dy/dist)*speed,
    hx, hy, text:line, age:0, life:2.8, form:0
  });
  demo.codeBusy=true;
  demo.codeGap=codeFast()?0.09:0.16;
  if (demo.codeShots.length>8) demo.codeShots=demo.codeShots.slice(-8);
}
function stepCode(dt){
  if (demo.editDelay>0) demo.editDelay=Math.max(0, demo.editDelay-dt);
  demo.codeGap=Math.max(0,(demo.codeGap||0)-dt);
  fireNextCode();
  for (const sh of demo.codeShots){
    sh.age += dt;
    const dx=sh.hx-sh.x, dy=sh.hy-sh.y;
    const dist=Math.hypot(dx,dy);
    const toward=sh.vx*dx + sh.vy*dy;
    if (dist<36 || (sh.age>0.05 && toward<=0) || sh.age>=sh.life){
      applyCodeLine(sh.text);
      sh.form=1; sh.x=sh.hx; sh.y=sh.hy; sh.vx=sh.vy=0;
    } else {
      const k=1-Math.exp(-10*dt);
      const speed=codeSpeed();
      const inv=1/(dist||1);
      sh.vx+=(dx*inv*speed-sh.vx)*k;
      sh.vy+=(dy*inv*speed-sh.vy)*k;
      sh.x+=sh.vx*dt; sh.y+=sh.vy*dt;
      sh.form=Math.min(0.9, 1-dist/180);
    }
  }
  demo.codeShots=demo.codeShots.filter(sh=>sh.form<1);
  demo.codeBusy=demo.codeShots.length>0 || demo.codeQ.length>0;
}
function thinkCols(){
  return 22;
}
function thinkBullets(text){
  const words=(text||"").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  const out=[]; let buf=[];
  for (const w of words){
    buf.push(w);
    const s=buf.join(" ");
    if (s.length>=16 || buf.length>=3){ out.push(s); buf=[]; }
  }
  if (buf.length) out.push(buf.join(" "));
  return out;
}
function thinkTarget(){
  const [wx,wy,,wh]=thinkWell();
  return [wx+10, wy+wh-24];
}
function fireNextThought(){
  if (!demo.thinkQ.length) return;
  if ((demo.thinkGap||0)>0) return;
  if (demo.thoughts.filter(th=>th.form<1).length>=2) return;
  const line=demo.thinkQ.shift();
  const [hx,hy]=thinkTarget();
  let x0=demo.x+demo.facing*18;
  let y0=demo.y-26;
  if (!Number.isFinite(x0) || !Number.isFinite(y0) || y0<-40 || y0>H+80 || x0<-40 || x0>W+40){
    x0=hx+40; y0=H-40;
  }
  const dx=hx-x0, dy=hy-y0;
  const dist=Math.hypot(dx,dy)||1;
  const speed=560;
  demo.thoughts.push({
    x:x0, y:y0,
    vx:(dx/dist)*speed, vy:(dy/dist)*speed,
    hx, hy, text:line, age:0, life:2.6, color:CYAN, form:0
  });
  demo.thinkBusy=true;
  demo.thinkGap=0.12;
  if (demo.thoughts.length>8) demo.thoughts=demo.thoughts.slice(-8);
}
function flushThink(done){
  const lines=thinkBullets(demo.thinking||"");
  const complete=done?lines:lines.slice(0, Math.max(0, lines.length-1));
  const fired=demo.thinkFired||0;
  if (complete.length>fired){
    demo.thinkQ.push(...complete.slice(fired));
    demo.thinkFired=complete.length;
  }
}
function setThink(text, done=false){
  const next=text||"";
  const prev=demo.thinking||"";
  if (!next || !next.startsWith(prev)){
    demo.thinkQ=[];
    demo.thinkFired=0;
    demo.thoughts=[];
    demo.thinkBoard=[];
    demo.thinkBusy=false;
  }
  demo.thinking=next;
  if (next){
    demo.thinkShow=true;
    demo.thinkHold=3.4;
  }
  flushThink(!!done);
}
function stepThoughts(dt){
  demo.thinkGap=Math.max(0,(demo.thinkGap||0)-dt);
  fireNextThought();
  demo.thinkLift += (0-demo.thinkLift)*(1-Math.exp(-9*dt));
  const busy=working || demo.thinkQ.length || demo.thoughts.length || demo.thinkBusy;
  if (busy) demo.thinkHold=3.4;
  else demo.thinkHold=Math.max(0, demo.thinkHold-dt);
  if (demo.thinkHold<=0 && !busy) demo.thinkShow=false;
  const want=demo.thinkShow?1:0;
  demo.thinkA += (want-demo.thinkA)*(1-Math.exp(-7*dt));
  if (demo.thinkA<0.02 && !demo.thinkShow){
    demo.thinkA=0;
    demo.thinking="";
    demo.thinkBoard=[];
    demo.thinkFired=0;
  }
  for (const th of demo.thoughts){
    th.age += dt;
    const dx=th.hx-th.x, dy=th.hy-th.y;
    const dist=Math.hypot(dx,dy);
    if (dist<14){
      th.form=1; th.x=th.hx; th.y=th.hy; th.vx=th.vy=0;
      demo.thinkBoard.push(th.text);
      if (demo.thinkBoard.length>8) demo.thinkBoard.shift();
      demo.thinkLift=18;
      demo.thinkBusy=false;
    } else {
      const k=1-Math.exp(-10*dt);
      const speed=560;
      const inv=1/(dist||1);
      th.vx+=(dx*inv*speed-th.vx)*k;
      th.vy+=(dy*inv*speed-th.vy)*k;
      th.x+=th.vx*dt; th.y+=th.vy*dt;
      th.form=Math.min(1, 1-dist/160);
    }
  }
  demo.thoughts=demo.thoughts.filter(th=>th.form<1 && th.age<th.life);
  demo.thinkBusy=demo.thoughts.length>0 || demo.thinkQ.length>0;
}
function talkCols(){
  const [, , tw]=talkWell();
  return Math.max(8, Math.floor((tw-24)/16));
}
function talkOpen(){
  return !!(demo.talks && demo.talks.some(t=>String(t||"").trim()));
}
function talkPages(){
  if (!talkOpen()) return [];
  const lines=wrapWords(demo.talks.join(" "), talkCols());
  const pages=[];
  for (let i=0;i<lines.length;i+=3) pages.push(lines.slice(i,i+3));
  return pages;
}
function setTalk(who, text){
  demo.talkWho = (who||"BUSAN").toUpperCase();
  demo.talks = [text||""];
  demo.talkI = 0;
}
function scrollTalk(dir){
  const n=talkPages().length;
  if (n<=1) return false;
  const next=Math.max(0, Math.min(n-1, demo.talkI+dir));
  if (next===demo.talkI) return false;
  demo.talkI=next;
  return true;
}
function canvasXY(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height];
}
function talkNextRect(){
  const [tx,ty,tw,th]=talkWell();
  const label="NEXT";
  const bw=textW(label,2)+16;
  const bh=22;
  return [tx+tw-bw-8, ty+th-bh-8, bw, bh, label];
}
function inTalkNext(x,y){
  if (!talkOpen()) return false;
  const pages=talkPages();
  if (demo.talkI+1>=pages.length) return false;
  const [nx,ny,nw,nh]=talkNextRect();
  return x>=nx && x<=nx+nw && y>=ny && y<=ny+nh;
}

function drawThought(th){
  if (th.form>=1) return;
  diamond(th.x-6, th.y+8, 8, CYAN, 0.95);
  drawText(th.text, th.x+1, th.y+1, INK, 2);
  drawText(th.text, th.x, th.y, CYAN, 2);
}

function draw(dt){
  demo.t += dt; demo.blink += dt; demo.pulse *= Math.exp(-7*dt);
  demo.skyA = Math.max(0, demo.skyA - dt/1.6);
  layoutPad();
  stepThoughts(dt);
  stepCode(dt);
  const [bx,by,bw,bh]=demo.box;
  const cx=bx+bw/2, cy=by+bh/2;
  const shooting=demo.codeQ.length||demo.codeShots.length||demo.thinkQ.length||demo.thoughts.length||demo.thinkBusy||demo.codeBusy;
  if (working) demo.phase += dt;
  if (working || shooting) demo.linger=3.2;
  else if (demo.linger>0) demo.linger=Math.max(0, demo.linger-dt);
  const stay=working || shooting || demo.linger>0;
  let tx, ty;
  if (stay){
    tx=cx+(bw/2-160)*Math.sin(demo.phase/5.5*Math.PI*2);
    ty=cy+(bh/2-140)*Math.sin(demo.phase/3.8*Math.PI*2+1.1);
  } else {
    tx=W/2;
    ty=-80;
  }
  const ox=demo.x;
  const k=demo.launch?1-Math.exp(-5.5*dt):stay?1-Math.exp(-4.2*dt):1-Math.exp(-2.0*dt);
  demo.x += (tx-demo.x)*k;
  demo.y += (ty-demo.y)*k;
  if (demo.launch && Math.hypot(tx-demo.x, ty-demo.y)<48) demo.launch=0;
  const vx=(demo.x-ox)/dt;
  if (vx<-28) demo.facing=-1; else if (vx>28) demo.facing=1;
  demo.trail.push([demo.x,demo.y]); if (demo.trail.length>22) demo.trail.shift();

  drawSea(demo.t, demo.sky, demo.skyA);
  rect(bx-8,by-8,bw+16,bh+16,mix(NAVY,demo.sky,0.18));
  rect(bx,by,bw,40,mix(INK,demo.sky,0.28));
  rect(bx,by+40,bw,bh-40,WELL);
  rect(bx,by+40,64,bh-40,GUTTER);
  const tag=demo.tool||demo.lang||"";
  const tagW=tag?textW(tag,2):0;
  const titleCols=Math.max(8, Math.floor((bw-32-tagW-24)/16));
  drawText(clipText(demo.file||"", titleCols), bx+16, by+10, CREAM, 2);
  if (tag) drawText(tag, bx+bw-tagW-16, by+10, toolColor(), 2);

  const shown=demo.code.length?demo.code:[""];
  const rows=padRows();
  const start=viewStart();
  for (let r=0;r<rows;r++){
    const i=start+r;
    const yy=by+56+r*36;
    if (yy>by+bh-28) break;
    drawText(String(i+1).padStart(2," "), bx+14, yy, DIM, 2);
    const line=clipText(shown[i]||"", padCols());
    const mark=demo.editAt!=null && !demo.editSpliced && i>=demo.editAt && i<demo.editAt+demo.editOldCount;
    if (line) drawText(line, bx+80, yy, mark?COIN:tint(line,i), 2);
    if (i===demo.caret && (demo.blink%0.9)<0.55){
      rect(bx+80+textW(line,2), yy-2, 3, 22, COIN, 0.95);
    }
  }

  const showThink=demo.thinkA>0.02;
  if (showThink){
    const a=demo.thinkA;
    const [wx,wy,ww,wh]=thinkWell();
    rect(wx-2,wy-2,ww+4,wh+4,INK,0.96*a);
    rect(wx,wy,ww,wh,mix(NAVY,CYAN,0.14),0.96*a);
    rect(wx,wy,ww,3,CYAN,a);
    drawText("THINKING", wx+10, wy+8, CYAN, 2, a);
    ctx.save();
    ctx.beginPath(); ctx.rect(wx+4, wy+24, ww-8, wh-28); ctx.clip();
    const lh=18;
    const vis=demo.thinkBoard.slice(-3);
    for (let i=0;i<vis.length;i++){
      const yy=wy+wh-6-(vis.length-i)*lh+demo.thinkLift;
      drawText(vis[i], wx+10, yy, CREAM, 2, a);
    }
    ctx.restore();
  }

  demo.trail.forEach(([x,y],i)=>{ const k=(i+1)/demo.trail.length; diamond(x,y,3+4*k,CYAN,0.12*k); });
  for (let i=0;i<8;i++) diamond(demo.x, demo.y+28+i*5, 6-i*0.45, mix(CYAN,COIN,i/8), 0.55);
  const bob=Math.sin(demo.t*1.6*Math.PI*2)*4;
  drawShip(demo.x, demo.y+bob, demo.facing, demo.scale, demo.pulse, working?CYAN:demo.sky);

  for (const th of demo.thoughts) drawThought(th);
  for (const sh of demo.codeShots){
    if (sh.form>=1) continue;
    diamond(sh.x-6, sh.y+8, 8, toolColor(), 0.95);
    const bit=(sh.text||" ").slice(0,28);
    drawText(bit, sh.x+1, sh.y+1, INK, 2);
    drawText(bit, sh.x, sh.y, CREAM, 2);
  }

  rect(0,0,W,48,INK,0.72);
  drawText("Busan Coder", 20, 16, COIN, 2);
  const credit="Inspired by Causewaybay Hacker";
  drawText(credit, W-textW(credit,2)-20, 16, CREAM, 2);

  if (talkOpen()){
    const [tx,ty,tw,th]=talkWell();
    const who=demo.talkWho||"BUSAN";
    const pages=talkPages();
    demo.talkI=Math.max(0, Math.min(demo.talkI, pages.length-1));
    const lines=pages[demo.talkI]||[];
    rect(tx-2,ty-2,tw+4,th+4,INK,0.92);
    rect(tx,ty,tw,th,CREAM,0.96);
    rect(tx,ty,tw,4,COIN,1);
    drawText(who, tx+10, ty+8, INK, 2);
    if (pages.length>1){
      const mark=`${demo.talkI+1}/${pages.length}`;
      drawText(mark, tx+tw-textW(mark,2)-10, ty+8, DIM, 2);
    }
    for (let i=0;i<lines.length;i++) drawText(lines[i], tx+10, ty+32+i*18, INK, 2);
    if (demo.talkI+1<pages.length){
      const [nx,ny,nw,nh,label]=talkNextRect();
      rect(nx, ny, nw, nh, COIN, 1);
      drawText(label, nx+8, ny+4, INK, 2);
    }
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  draw(dt);
  requestAnimationFrame(loop);
}

const composer=document.getElementById("composer");
const newBtn=document.getElementById("new-btn");
let working=false, history=[], histI=-1, draft="", chatGen=0;

function resetPad(){
  demo.file="";
  demo.lang="";
  demo.code=[];
  demo.caret=-1;
  demo.skyA=0;
  demo.live=false;
  demo.tool="";
  demo.pulse=0;
  demo.caption="";
  demo.talkWho="BUSAN";
  demo.talks=[];
  demo.talkI=0;
  demo.thinking="";
  demo.thinkQ=[];
  demo.thoughts=[];
  demo.thinkBoard=[];
  demo.thinkFired=0;
  demo.thinkBusy=false;
  demo.thinkLift=0;
  demo.thinkHold=0;
  demo.thinkA=0;
  demo.thinkShow=false;
  demo.trail=[];
  demo.codeQ=[]; demo.codeShots=[]; demo.codeBusy=false; demo.codeKey="";
  demo.editAt=null; demo.editOldCount=0; demo.editSpliced=false; demo.editInsert=null; demo.editDelay=0;
  demo.linger=0; demo.launch=0;
}

async function newChat(){
  chatGen += 1;
  if (working) await abortTurn();
  await fetch("/api/new",{method:"POST"}).catch(()=>{});
  history=[]; histI=-1; draft="";
  composer.value="";
  paintBar();
  setWorking(false);
  resetPad();
  composer.focus();
}

function enterOrigin(){
  return [W/2, H+36];
}
function launchFromEnter(){
  const [ex,ey]=enterOrigin();
  demo.x=ex; demo.y=ey;
  demo.facing=-1;
  demo.pulse=1;
  demo.trail=[];
  demo.launch=1;
}
function setWorking(on){
  working=on;
  composer.readOnly=on;
}

function paintBar(){
  document.getElementById("bar").textContent="__FIGHTER_NAME__";
}
function setUsage(){}

async function abortTurn(){ await fetch("/api/abort",{method:"POST"}); }

async function sendTurn(text){
  if (!text||working) return;
  const gen=chatGen;
  launchFromEnter();
  setWorking(true); demo.live=true; demo.pulse=1; demo.caption="GROK  ·  working";
  composer.value=""; history.push(text); histI=-1; draft="";
  demo.thoughts=[]; demo.thinkFired=0; demo.thinkQ=[]; demo.thinkBusy=false; demo.thinkBoard=[]; demo.thinkLift=0; setThink("");
  setTalk("YOU", text);
  let thinking="", agent="";
  const alive=()=>gen===chatGen;
  try{
    const res=await fetch("/api/turn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    if (!alive()) return;
    if (!res.ok){
      const err=await res.json().catch(()=>({error:res.statusText}));
      if (alive()){ setTalk("error", err.error||"request failed"); setWorking(false); }
      return;
    }
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(alive()){
      const {value,done}=await reader.read(); if (done) break;
      buf+=dec.decode(value,{stream:true}).replace(/\r\n/g,"\n");
      while(buf.includes("\n\n")){
        const i=buf.indexOf("\n\n"); const block=buf.slice(0,i); buf=buf.slice(i+2);
        let event="message", data="";
        for (const line of block.split("\n")){
          if (line.startsWith("event:")) event=line.slice(6).trim();
          else if (line.startsWith("data:")) data+=line.slice(5).trim();
        }
        if (!data || !alive()) continue;
        let v={}; try{ v=JSON.parse(data); }catch{ continue; }
        if (event==="think"){ thinking+=v.text||""; setThink(thinking); demo.pulse=0.7; demo.caption="THINKING  ·  grok"; }
        else if (event==="delta"){ agent+=v.text||""; setTalk("__FIGHTER_CALLSIGN__", agent); demo.caption="SAY  ·  grok"; }
        else if (event==="open"){
          if ((v.name||"")==="edit" && v.path){
            demo.caption=`EDIT  ·  ${v.path}`; demo.pulse=1;
            loadOriginal(v.path, v.preview||"");
          }
        }
        else if (event==="tool"){
          const name=(v.name||"").split(".").pop();
          demo.caption=`TOOL  ·  ${name}`; demo.pulse=1;
          if (name==="read"){
            shootRead(v.path||demo.file, v.preview||v.detail||"");
          }
          if (name==="write" && !v.is_error){
            shootWrite(v.path||demo.file, v.preview||v.content||"");
          }
          if (name==="edit" && !v.is_error){
            if (v.edit_orig||v.preview)
              loadOriginal(v.path||demo.file, v.edit_orig||v.preview||"");
            shootEdit(v.path||demo.file, v.edit_old||"", v.edit_new||"");
          }
          if (name==="bash"){
            shootShell(v.cmd||"", v.preview||v.detail||"");
          }
          if (v.detail) setTalk(name.toUpperCase()||"TOOL", `${v.is_error?"error":"ok"}  ${v.path||v.cmd||""}`.trim());
        }
        else if (event==="usage"){
          setUsage(v);
        }
        else if (event==="error") setTalk("error", v.text||"error");
        else if (event==="end"){ if (v.text && !agent){ setTalk("__FIGHTER_CALLSIGN__", v.text); } }
      }
    }
  } catch(e){ if (alive()) setTalk("error", String(e)); }
  if (!alive()) return;
  flushThink(true);
  setWorking(false); demo.caption=""; composer.focus();
  if (RECORD) setTimeout(()=>fetch("/api/record-done",{method:"POST"}).catch(()=>{}), 4200);
}

window.addEventListener("keydown", e=>{
  if ((e.ctrlKey||e.metaKey) && (e.key==="n"||e.key==="N")){
    e.preventDefault();
    newChat();
    return;
  }
});
canvas.addEventListener("click", e=>{
  const [x,y]=canvasXY(e);
  if (inTalkNext(x,y)) scrollTalk(1);
});
composer.addEventListener("keydown", e=>{
  if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if (!working) sendTurn(composer.value.trim()); }
  else if (e.key==="Escape" && working) abortTurn();
  else if (e.key==="ArrowUp" && composer.selectionStart===0 && history.length){
    if (histI<0) draft=composer.value;
    histI=histI<0?history.length-1:Math.max(0,histI-1);
    composer.value=history[histI]; e.preventDefault();
  } else if (e.key==="ArrowDown" && histI>=0){
    histI+=1;
    if (histI>=history.length){ histI=-1; composer.value=draft; }
    else composer.value=history[histI];
    e.preventDefault();
  }
});
newBtn.addEventListener("click", newChat);

const qs=new URLSearchParams(location.search);
const RECORD=qs.has("record");
let lastPost=0, posting=false;

function postFrame(){
  if (posting) return;
  posting=true;
  canvas.toBlob(blob=>{
    if (!blob){ posting=false; return; }
    fetch("/api/frame",{method:"POST",body:blob}).finally(()=>{ posting=false; });
  }, "image/png");
}

const _loop=loop;
loop=function(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  draw(dt);
  if (RECORD && now-lastPost>=1000/30){ lastPost=now; postFrame(); }
  requestAnimationFrame(loop);
};

requestAnimationFrame(loop);
composer.focus();
if (RECORD){
  setTimeout(()=>sendTurn("__FIGHTER_RECORD_PROMPT__"), 900);
}
</script>
